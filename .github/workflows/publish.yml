name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Publish to'
        required: true
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify package version is synced
        run: python scripts/version_sync.py check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install -r dashboard/backend/requirements.txt

      - name: Run tests
        run: |
          pytest tests/ -v --ignore=tests/integration/test_postgresql_storage.py

      - name: Check markdown files
        run: |
          npm install -g markdownlint-cli
          python scripts/check_markdown.py

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set version from release tag
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import configparser, os
          tag = os.environ["GITHUB_REF_NAME"]  # e.g. v0.2.1
          version = tag.lstrip("v")
          cfg = configparser.ConfigParser()
          cfg.read("setup.cfg")
          cfg["metadata"]["version"] = version
          with open("setup.cfg", "w") as f:
            cfg.write(f)
          print("Version set to", version)
          PY

      - name: Sync dashboard files from setup.cfg version
        run: python scripts/version_sync.py sync

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Build dashboard SPA (into dashboard/backend/static)
        run: |
          cd dashboard/frontend
          npm ci
          npm run build

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish_testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'testpypi')
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing
    environment:
      name: testpypi
      url: https://test.pypi.org/project/markethelm/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          skip-existing: true

  # Releases publish to PyPI only after TestPyPI succeeds. A manual "pypi" run skips
  # the TestPyPI job, so `!cancelled()` lets this job run despite the skipped need.
  publish_pypi:
    name: Publish to PyPI
    needs: [build, publish_testpypi]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && (
      (github.event_name == 'release' && needs.publish_testpypi.result == 'success') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'pypi') ) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/project/markethelm/

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Tiny artifact so "Post-release sync to main" (workflow_run) knows the release tag.
  export_release_tag:
    name: Export release tag for post-release sync
    needs: publish_pypi
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s\n' "${{ github.ref_name }}" > tag.txt
      - uses: actions/upload-artifact@v4
        with:
          name: post-release-tag
          path: tag.txt
          retention-days: 3

name: Refresh CI base images

on:
  push:
    branches: [main]
    paths: [.github/workflows/ci-base-images.yml]
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * 1'

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Mirror ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            source: postgres:16-alpine
            tag: 16-alpine
          - name: node
            source: node:22.23.2-alpine
            tag: 22.23.2-alpine
          - name: python
            source: python:3.12-slim
            tag: 3.12-slim
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image for Linux x64 CI runners
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
          TARGET_IMAGE: ghcr.io/${{ github.repository_owner }}/markethelm-ci-${{ matrix.name }}:${{ matrix.tag }}
        run: |
          set -euo pipefail
          docker pull --platform linux/amd64 "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "$TARGET_IMAGE"
          docker push "$TARGET_IMAGE"

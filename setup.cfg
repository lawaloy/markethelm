[metadata]
name = markethelm
version = 0.3.7
description = Market intelligence for informed decisions: market signals, AI-assisted insight, and outcome validation, with controlled execution as a long-term goal.
long_description = file: README.md
long_description_content_type = text/markdown
author = Olawal
author_email = lasei_1992@yahoo.com
url = https://github.com/lawaloy/markethelm
project_urls = 
	Bug Tracker = https://github.com/lawaloy/markethelm/issues
	Documentation = https://github.com/lawaloy/markethelm#readme
	Source Code = https://github.com/lawaloy/markethelm
license = MIT
license_files = LICENSE
keywords = stocks, trading, market-analysis, finnhub, stock-screener, projections, technical-analysis, markethelm
classifiers = 
	Development Status :: 4 - Beta
	Intended Audience :: Developers
	Intended Audience :: Financial and Insurance Industry
	License :: OSI Approved :: MIT License
	Operating System :: OS Independent
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3.12
	Topic :: Office/Business :: Financial :: Investment
	Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
package_dir = 
	= .
python_requires = >=3.12
include_package_data = True
install_requires = 
	pandas>=2.0.0
	exchange-calendars>=4.13.2
	requests>=2.31.0
	urllib3>=2.0.0
	python-dotenv>=1.0.0
	pytickersymbols>=1.0.0
	fastapi>=0.109.0
	uvicorn[standard]>=0.27.0
	httpx>=0.25.0
	pydantic>=2.5.0
	python-multipart>=0.0.32
	psycopg>=3.2.0

[options.extras_require]
ai = 
	openai>=1.0.0
dev = 
	pytest>=7.0.0
	pytest-cov>=4.0.0
	PyYAML>=6.0.0
	black>=26.1,<27
	isort>=8.0,<10
all = 
	openai>=1.0.0
	pytest>=7.0.0
	pytest-cov>=4.0.0
	PyYAML>=6.0.0
	black>=26.1,<27
	isort>=8.0,<10

[options.packages.find]
where = .
include = src*, dashboard*

[options.entry_points]
console_scripts = 
	markethelm = src.cli.commands:main
	markethelm-web = dashboard.backend.dashboard_cli:main

